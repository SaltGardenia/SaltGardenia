name: Update Contribution Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate default theme
        uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false
          THEME: default

      - name: Stage default theme
        run: |
          mkdir -p staging
          cp -f profile-summary-card-output/default/*.svg staging/ || true

      - name: Generate github_dark theme
        uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false
          THEME: github_dark

      - name: Stage dark theme (suffix -dark)
        run: |
          mkdir -p staging
          for f in profile-summary-card-output/github_dark/*.svg; do
            base=$(basename "$f" .svg)
            cp -f "$f" "staging/${base}-dark.svg"
          done

      - name: Publish to output branch
        run: |
          git fetch origin output
          git checkout -B output origin/output
          mkdir -p stats
          cp -f staging/*.svg stats/ || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "chore: update contribution stats cards"
            git push origin output
          fi
