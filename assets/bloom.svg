<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="A white gardenia rendered as faceted salt crystals around a gold center">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E4C76A"/>
      <stop offset="55%" stop-color="#C8A24B"/>
      <stop offset="100%" stop-color="#9A7A2E"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF8F0"/>
      <stop offset="100%" stop-color="#D9CBB2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <g transform="translate(120,120)" fill="url(#petal)" stroke="#6FB7A6" stroke-width="1.1" stroke-linejoin="round">
    <g class="bloom">
      <g transform="rotate(0)">
        <polygon points="0,-14 11,-44 4,-78 -4,-78 -11,-44" opacity="0.96"/>
        <polygon points="0,-14 11,-44 0,-52 -11,-44" fill="#F4F1E9" stroke="#8FCDBE"/>
      </g>
      <g transform="rotate(45)">
        <polygon points="0,-14 11,-44 4,-78 -4,-78 -11,-44" opacity="0.96"/>
        <polygon points="0,-14 11,-44 0,-52 -11,-44" fill="#F4F1E9" stroke="#8FCDBE"/>
      </g>
      <g transform="rotate(90)">
        <polygon points="0,-14 11,-44 4,-78 -4,-78 -11,-44" opacity="0.96"/>
        <polygon points="0,-14 11,-44 0,-52 -11,-44" fill="#F4F1E9" stroke="#8FCDBE"/>
      </g>
      <g transform="rotate(135)">
        <polygon points="0,-14 11,-44 4,-78 -4,-78 -11,-44" opacity="0.96"/>
        <polygon points="0,-14 11,-44 0,-52 -11,-44" fill="#F4F1E9" stroke="#8FCDBE"/>
      </g>
      <g transform="rotate(180)">
        <polygon points="0,-14 11,-44 4,-78 -4,-78 -11,-44" opacity="0.96"/>
        <polygon points="0,-14 11,-44 0,-52 -11,-44" fill="#F4F1E9" stroke="#8FCDBE"/>
      </g>
      <g transform="rotate(225)">
        <polygon points="0,-14 11,-44 4,-78 -4,-78 -11,-44" opacity="0.96"/>
        <polygon points="0,-14 11,-44 0,-52 -11,-44" fill="#F4F1E9" stroke="#8FCDBE"/>
      </g>
      <g transform="rotate(270)">
        <polygon points="0,-14 11,-44 4,-78 -4,-78 -11,-44" opacity="0.96"/>
        <polygon points="0,-14 11,-44 0,-52 -11,-44" fill="#F4F1E9" stroke="#8FCDBE"/>
      </g>
      <g transform="rotate(315)">
        <polygon points="0,-14 11,-44 4,-78 -4,-78 -11,-44" opacity="0.96"/>
        <polygon points="0,-14 11,-44 0,-52 -11,-44" fill="#F4F1E9" stroke="#8FCDBE"/>
      </g>
    </g>
    <circle r="14" fill="url(#core)" stroke="#6FB7A6" stroke-width="1.4" filter="url(#soft)"/>
    <polygon points="0,-9 8,-3 5,8 -5,8 -8,-3" fill="none" stroke="#F4F1E9" stroke-width="0.9" opacity="0.7"/>
  </g>

  <style>
    @keyframes grow {
      from { opacity: 0; transform: translate(120px,120px) scale(0.2); }
      60%  { opacity: 1; }
      to   { opacity: 1; transform: translate(120px,120px) scale(1); }
    }
    @keyframes breathe {
      from { transform: translate(120px,120px) scale(1); }
      to   { transform: translate(120px,120px) scale(1.04); }
    }
    .bloom {
      transform-box: fill-box;
      transform-origin: center;
      animation: grow 1.6s cubic-bezier(.2,.8,.2,1) both,
                 breathe 4s ease-in-out 1.6s infinite alternate;
    }
    @media (prefers-reduced-motion: reduce) {
      .bloom { animation: none; }
    }
  </style>
</svg>
